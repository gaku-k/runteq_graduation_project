name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@db:5432/runteq_graduation_project_test
      HEADLESS_CHROME: "true" # テスト実行に必要な変数をすべてここに集約

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runteq_graduation_project_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Add app bin to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            postgresql-client chromium curl libjemalloc2 libvips fonts-liberation
      
      - name: Wait for PostgreSQL
        run: |
          set -e
          for i in $(seq 1 10); do
            if pg_isready -h $PGHOST -U $PGUSER -d runteq_graduation_project_test -t 1; then
              echo "PostgreSQL is ready and accepting connections!"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/10)"
            sleep 6
          done
          echo "PostgreSQL failed to start within the timeout."
          exit 1

      - name: Database setup
        run: bin/rails db:prepare

      - name: Run Rails tests
        run: bin/rails test:all